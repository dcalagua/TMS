# TMS by EBIM - continuous integration.
#
# Runs the same gates a developer runs locally (CLAUDE.md, scripts/README.md):
#
#   backend   ./mvnw -B test        (Testcontainers starts a disposable postgis/postgis:17-3.5)
#   frontend  npm ci && npm run typecheck && npm run lint && npm test && npm run build
#
# It touches no shared environment: no secret is read, no Supabase project, no Render or Amplify.
# Publishing a build is a separate concern (scripts/ci/check-frontend-env.sh and
# assert-frontend-bundle.sh, run by the deployment pipeline with the real VITE_* values); the build
# here only proves the code compiles and bundles, with env.ts's local defaults.

name: ci

on:
  push:
    branches: [dev, qas, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Java 21, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/tms-api/pom.xml

      # ubuntu-latest ships a running Docker daemon, which is all Testcontainers needs - no service
      # container. This step makes its absence fail the job: DockerAvailability would otherwise
      # SKIP every database test and the build would go green having verified no migration.
      - name: Docker is available for Testcontainers
        run: |
          docker info --format 'Docker {{.ServerVersion}} on {{.OperatingSystem}}'
          docker pull postgis/postgis:17-3.5

      - name: Backend tests
        run: scripts/backend-test.sh

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/tms-api/target/surefire-reports/
          retention-days: 7

  frontend:
    name: frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/tms-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/tms-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/tms-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
