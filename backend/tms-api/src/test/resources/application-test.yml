# Test profile.
#
# Tests must never reach a shared or remote database. Slice tests (web/security layer)
# run without any datasource at all; from Step 02 onwards, tests that need PostgreSQL use
# Testcontainers, which supplies its own throwaway datasource properties.

spring:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
  datasource:
    hikari:
      # Two connections per context, not the default ten.
      #
      # Every @SpringBootTest in the suite shares ONE PostgreSQL container, and Spring caches
      # each distinct context for the whole run rather than closing it after its class. So the
      # connections are not held by the test that is running - they are held by every context
      # that has ever run, all at once, and the total is (contexts x pool size) against a server
      # whose default max_connections is 100. At ten apiece the suite runs out part way through
      # and the rest of the run dies as `FATAL: sorry, too many clients already`, which reads
      # like a broken application and is really just arithmetic.
      #
      # Two is enough: these tests drive MockMvc on one thread, and the second connection covers
      # a test that checks the database directly while a transaction is still open.
      maximum-pool-size: 2
      minimum-idle: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

tms:
  api:
    base-path: /api/v1
    application-name: TMS by EBIM
  security:
    jwt:
      # Placeholders so the real decoder bean can be built. NimbusJwtDecoder fetches the JWK
      # set lazily, on the first token it decodes, so nothing here ever performs a network
      # call - and `.invalid` is a reserved TLD that cannot resolve even if something tried.
      # Tests that decode a token supply their own locally generated key (TestJwts); the
      # filter chain, the converter and the claim validators under test are the production ones.
      issuer-uri: https://tms-test.invalid/auth/v1
      jwk-set-uri: https://tms-test.invalid/auth/v1/.well-known/jwks.json
      audiences: authenticated
    cors:
      allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    com.ebim.tms: DEBUG
