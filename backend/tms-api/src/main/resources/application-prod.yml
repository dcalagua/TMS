# Production/staging profile: every value comes from the environment.
# There are no fallbacks on purpose - a missing variable must fail fast at startup
# instead of silently starting against the wrong database.

spring:
  datasource:
    url: ${TMS_DB_URL}
    username: ${TMS_DB_USERNAME}
    password: ${TMS_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${TMS_DB_POOL_MAX:20}
      minimum-idle: ${TMS_DB_POOL_MIN:5}
      pool-name: tms-pool
  flyway:
    enabled: true

server:
  forward-headers-strategy: framework

tms:
  api:
    # The full API surface is not published to anonymous callers in a deployment: the
    # documentation endpoints fall through to `anyRequest().authenticated()`.
    #
    # springdoc itself stays enabled rather than switched off, because an operator with a
    # token still needs to read the contract of what is deployed. That is a deliberate answer
    # to springdoc's own "disable it in production" warning, not an oversight - the exposure
    # is closed by authentication, which is testable (DocumentationExposureTest) and does not
    # remove a legitimate operational capability.
    public-documentation: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${TMS_AI_ANTHROPIC_MODEL:claude-opus-5-5}
      effort: ${TMS_AI_ANTHROPIC_EFFORT:medium}
      timeout: ${TMS_AI_ANTHROPIC_TIMEOUT:90s}
      max-retries: ${TMS_AI_ANTHROPIC_MAX_RETRIES:1}
      max-tokens: ${TMS_AI_ANTHROPIC_MAX_TOKENS:16000}
  mailhub:
    url: ${TMS_MAILHUB_URL:https://bfoqzrvkolrokeqgtnjr.supabase.co/functions/v1/mailhub-send}
    token: ${MAILHUB_TOKEN:}
    region: ${TMS_MAILHUB_REGION:us-east-1}
  auth:
    password-reset:
      redirect-url: ${TMS_PASSWORD_RESET_REDIRECT_URL:}
      link-validity: ${TMS_PASSWORD_RESET_LINK_VALIDITY:1 hora}
      product-name: ${TMS_PASSWORD_RESET_PRODUCT_NAME:TMS}
      time-zone: ${TMS_PASSWORD_RESET_TIME_ZONE:America/Lima}
    invitation:
      # The new user's welcome email, template registro-usuario (ADR-031). Its link lands on the
      # same page as the reset's. urlAcceso: the frontend's public URL; empty turns invitations off.
      access-url: ${TMS_INVITATION_ACCESS_URL:}
      # vigencia: must say what the project's Auth email OTP expiry actually is.
      link-validity: ${TMS_INVITATION_LINK_VALIDITY:${TMS_PASSWORD_RESET_LINK_VALIDITY:1 hora}}
    supabase:
      # The same project and service_role key the evidence store uses (ADR-020), unless set apart.
      url: ${TMS_SUPABASE_URL:${TMS_EVIDENCE_SUPABASE_URL:}}
      service-key: ${TMS_SUPABASE_SERVICE_KEY:${TMS_EVIDENCE_SUPABASE_SERVICE_KEY:}}

# `prod` also switches on the stricter JWT rules in SupabaseJwtDecoders: the issuer and JWKS
# URIs must be https and must not resolve to a loopback address, so a local development
# configuration that reaches a deployment fails at startup instead of trusting a local key
# server.

logging:
  level:
    root: WARN
    com.ebim.tms: INFO
