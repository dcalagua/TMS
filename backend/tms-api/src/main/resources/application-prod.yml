# Production/staging profile: every value comes from the environment.
# There are no fallbacks on purpose - a missing variable must fail fast at startup
# instead of silently starting against the wrong database.

spring:
  datasource:
    url: ${TMS_DB_URL}
    username: ${TMS_DB_USERNAME}
    password: ${TMS_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${TMS_DB_POOL_MAX:20}
      minimum-idle: ${TMS_DB_POOL_MIN:5}
      pool-name: tms-pool
  flyway:
    enabled: true

server:
  forward-headers-strategy: framework

tms:
  api:
    # The full API surface is not published to anonymous callers in a deployment: the
    # documentation endpoints fall through to `anyRequest().authenticated()`.
    #
    # springdoc itself stays enabled rather than switched off, because an operator with a
    # token still needs to read the contract of what is deployed. That is a deliberate answer
    # to springdoc's own "disable it in production" warning, not an oversight - the exposure
    # is closed by authentication, which is testable (DocumentationExposureTest) and does not
    # remove a legitimate operational capability.
    public-documentation: false

# `prod` also switches on the stricter JWT rules in SupabaseJwtDecoders: the issuer and JWKS
# URIs must be https and must not resolve to a loopback address, so a local development
# configuration that reaches a deployment fails at startup instead of trusting a local key
# server.

logging:
  level:
    root: WARN
    com.ebim.tms: INFO
