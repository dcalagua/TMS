# TMS by EBIM - common backend configuration.
# Profile-specific overrides live in application-<profile>.yml.
# No credential ever has a production-usable default here.

spring:
  application:
    name: tms-api
  profiles:
    # Safe local development is the default when SPRING_PROFILES_ACTIVE is not set.
    default: local
  main:
    banner-mode: off
  jpa:
    # Never keep a database session open for view rendering in a stateless JSON API.
    open-in-view: false
    hibernate:
      # Flyway owns the schema (ADR-002). Hibernate never creates or alters it.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      # Entities map to the Flyway-owned `tms` schema without repeating it on every @Table.
      hibernate.default_schema: tms
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Application objects live in the `tms` schema, never in `public`: the Supabase Data API
    # exposes only public/graphql_public, so a separate schema removes the HTTP surface
    # entirely (see docs/security/RLS_STRATEGY.md). Flyway owns its history table there too.
    schemas: tms
    default-schema: tms
    create-schemas: true
    # An existing non-empty schema must be migrated deliberately, never baselined silently.
    baseline-on-migrate: false
    validate-on-migrate: true
    # `clean` must never be reachable from an application process.
    clean-disabled: true
  servlet:
    multipart:
      # The bulk order import is the only multipart endpoint. Both limits mirror
      # OrderImportLimits.MAX_FILE_BYTES, and this is the half that matters most: it rejects an
      # oversized upload while it is still streaming, before the request is fully buffered.
      # OrderImportService checks the received bytes again, so the limit does not depend on this
      # file alone being right.
      max-file-size: 2MB
      max-request-size: 3MB
  threads:
    virtual:
      enabled: true

server:
  port: ${TMS_API_PORT:8080}
  shutdown: graceful
  error:
    # Do not leak internals to clients.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # Only liveness/readiness and build identification. Nothing that lists beans,
        # configuration properties, environment variables or the HTTP mappings.
        include: health,info
  endpoint:
    health:
      # Component details (database URL, disk paths, vendor versions) are never rendered to
      # a caller. The probe answer is UP or DOWN, which is all a load balancer needs.
      show-details: never
      probes:
        enabled: true
  info:
    env:
      # Would publish every `info.*` property, which is exactly how a secret escapes.
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

tms:
  api:
    base-path: /api/v1
    application-name: TMS by EBIM
    # OpenAPI/Swagger UI without authentication. Overridden to false in prod.
    public-documentation: true
  security:
    jwt:
      # Supabase Auth coordinates. No default: a deployment that does not set these fails at
      # startup with an explicit message (SupabaseJwtDecoders), because the alternative -
      # starting with token verification disabled - must not be reachable by omission.
      # There is no signing secret setting; signatures are verified against the published JWKS.
      issuer-uri: ${TMS_SUPABASE_JWT_ISSUER_URI:}
      jwk-set-uri: ${TMS_SUPABASE_JWKS_URI:}
      audiences: ${TMS_SUPABASE_JWT_AUDIENCES:authenticated}
      clock-skew: 30s
    cors:
      # Empty by default: no cross-origin browser call is allowed until origins are listed.
      allowed-origins: ${TMS_CORS_ALLOWED_ORIGINS:}

logging:
  # The correlation id is on every line, so a request can be followed across log entries and
  # matched to the `correlationId` in the error document the caller received.
  pattern:
    level: "%5p [%X{correlationId:-no-correlation-id}]"
  level:
    root: INFO
    com.ebim.tms: INFO
