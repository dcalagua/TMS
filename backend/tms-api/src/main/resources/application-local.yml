# Local development profile.
#
# Defaults point at the local Supabase stack started with `supabase start`
# (see supabase/README.md). Those are the CLI's well-known local development
# coordinates on a throwaway container - they are not, and must never become,
# credentials of a shared or remote database. Override everything through the
# environment (see .env.example).

spring:
  datasource:
    url: ${TMS_DB_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${TMS_DB_USERNAME:postgres}
    password: ${TMS_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${TMS_DB_POOL_MAX:10}
      minimum-idle: 2
      pool-name: tms-local-pool
  jpa:
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: ${TMS_FLYWAY_ENABLED:true}

tms:
  security:
    jwt:
      # The local Supabase stack (`supabase start`) publishes its JWKS here. These are local
      # container coordinates, not credentials. If your project signs with the legacy shared
      # secret rather than an asymmetric key, switch it to asymmetric signing keys in Studio:
      # TMS verifies published public keys only and has no setting for a shared secret.
      issuer-uri: ${TMS_SUPABASE_JWT_ISSUER_URI:http://127.0.0.1:54321/auth/v1}
      jwk-set-uri: ${TMS_SUPABASE_JWKS_URI:http://127.0.0.1:54321/auth/v1/.well-known/jwks.json}
    cors:
      allowed-origins: ${TMS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${TMS_AI_ANTHROPIC_MODEL:claude-opus-5-5}
      effort: ${TMS_AI_ANTHROPIC_EFFORT:medium}
      timeout: ${TMS_AI_ANTHROPIC_TIMEOUT:90s}
      max-retries: ${TMS_AI_ANTHROPIC_MAX_RETRIES:1}
      max-tokens: ${TMS_AI_ANTHROPIC_MAX_TOKENS:16000}
  mailhub:
    url: ${TMS_MAILHUB_URL:https://bfoqzrvkolrokeqgtnjr.supabase.co/functions/v1/mailhub-send}
    token: ${MAILHUB_TOKEN:}
    region: ${TMS_MAILHUB_REGION:us-east-1}
  auth:
    password-reset:
      redirect-url: ${TMS_PASSWORD_RESET_REDIRECT_URL:http://localhost:5173/reset-password}
      link-validity: ${TMS_PASSWORD_RESET_LINK_VALIDITY:1 hora}
      product-name: ${TMS_PASSWORD_RESET_PRODUCT_NAME:TMS}
      time-zone: ${TMS_PASSWORD_RESET_TIME_ZONE:America/Lima}
    invitation:
      # The new user's welcome email, template registro-usuario (ADR-031). Its link lands on the
      # same page as the reset's (password-reset.redirect-url).
      # urlAcceso: where the person signs in from then on.
      access-url: ${TMS_INVITATION_ACCESS_URL:http://localhost:5173}
      # vigencia: how long the invitation link lasts - Supabase's email OTP expiry, the same one the
      # reset link has (otp_expiry = 3600 in supabase/config.toml, i.e. 1 hora).
      link-validity: ${TMS_INVITATION_LINK_VALIDITY:${TMS_PASSWORD_RESET_LINK_VALIDITY:1 hora}}
    supabase:
      # The Auth admin API issues the recovery link (it sends nothing; MailHub does). The
      # service_role key of the local stack is printed by `supabase status`.
      url: ${TMS_SUPABASE_URL:http://127.0.0.1:54321}
      service-key: ${TMS_SUPABASE_SERVICE_KEY:${TMS_EVIDENCE_SUPABASE_SERVICE_KEY:}}

management:
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ebim.tms: DEBUG
    org.flywaydb: INFO
