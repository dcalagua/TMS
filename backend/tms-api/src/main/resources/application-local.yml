# Local development profile.
#
# Defaults point at the local Supabase stack started with `supabase start`
# (see supabase/README.md). Those are the CLI's well-known local development
# coordinates on a throwaway container - they are not, and must never become,
# credentials of a shared or remote database. Override everything through the
# environment (see .env.example).

spring:
  datasource:
    url: ${TMS_DB_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${TMS_DB_USERNAME:postgres}
    password: ${TMS_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${TMS_DB_POOL_MAX:10}
      minimum-idle: 2
      pool-name: tms-local-pool
  jpa:
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: ${TMS_FLYWAY_ENABLED:true}

tms:
  security:
    jwt:
      # The local Supabase stack (`supabase start`) publishes its JWKS here. These are local
      # container coordinates, not credentials. If your project signs with the legacy shared
      # secret rather than an asymmetric key, switch it to asymmetric signing keys in Studio:
      # TMS verifies published public keys only and has no setting for a shared secret.
      issuer-uri: ${TMS_SUPABASE_JWT_ISSUER_URI:http://127.0.0.1:54321/auth/v1}
      jwk-set-uri: ${TMS_SUPABASE_JWKS_URI:http://127.0.0.1:54321/auth/v1/.well-known/jwks.json}
    cors:
      allowed-origins: ${TMS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ebim.tms: DEBUG
    org.flywaydb: INFO
