# TMS by EBIM - Render blueprint.
#
# Two services from one repository. Every secret is declared with `sync: false`, which tells
# Render to prompt for the value in the dashboard and keep it out of this file - nothing here
# is a credential, and nothing here should become one.
#
# The database is NOT declared here on purpose. TMS runs against Supabase PostgreSQL, and a
# Render-managed database would be a second, competing home for the schema.

services:
  # ------------------------------------------------------------------------------------------
  # Backend - Java 21 + Spring Boot. Owns every business rule; the browser never reaches the
  # database directly.
  # ------------------------------------------------------------------------------------------
  - type: web
    name: tms-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/tms-api/Dockerfile
    dockerContext: ./backend/tms-api
    # OPEN QUESTION, and the first thing to settle before the next promotion: this blueprint
    # declares no `branch:`, so which branch this service deploys from lives only in the Render
    # dashboard and nothing in this repository can answer it. Two merges into `qas` have happened
    # and no backend appears to have booted from them. `main` sits at an old, unrelated commit, so
    # "this service tracks main" is the leading explanation and is worth checking first.
    #
    # A `branch:` line is deliberately NOT added here on a guess. Render honours it only for a
    # service it manages from this blueprint; for one created by hand in the dashboard the
    # dashboard remains the truth, and adding the key would read as settled when it is not.
    # Confirm in the console (tms-api -> Settings -> Branch), then declare it here.
    # Render only routes traffic to an instance once this answers 200. Spring Boot's readiness
    # probe reports UP after Flyway has finished, so a deploy cannot serve requests while the
    # schema is still migrating.
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Release identity needs nothing set here: Render injects RENDER_GIT_COMMIT into every
      # service and GET /api/v1/system/info reads it, so `commit` answers "which build is live"
      # without a dashboard. Set TMS_RELEASE_COMMIT by hand only if that field comes back null.

      # Supabase PostgreSQL. Use the connection pooler URI (port 6543) rather than the direct
      # one: Render restarts instances freely and the pooler is what keeps that from exhausting
      # the database's connection slots.
      - key: TMS_DB_URL
        sync: false
      - key: TMS_DB_USERNAME
        sync: false
      - key: TMS_DB_PASSWORD
        sync: false

      # Supabase Auth. Signatures are verified against the published JWKS, so there is no
      # signing secret to set. The prod profile refuses a non-https or loopback issuer.
      - key: TMS_SUPABASE_JWT_ISSUER_URI
        sync: false
      - key: TMS_SUPABASE_JWKS_URI
        sync: false

      # The browser origin allowed to call this API. Empty means no cross-origin call is
      # permitted at all, so this has to be set to the frontend's URL for the app to work.
      - key: TMS_CORS_ALLOWED_ORIGINS
        sync: false

  # ------------------------------------------------------------------------------------------
  # El frontend NO se declara aquí.
  #
  # Se publica con AWS Amplify (`amplify.yml`, `appRoot: frontend/tms-web`): `npm ci` y
  # `npm run build`, y el contenido de `dist` servido como estático. No hay contenedor y no hay
  # nginx que mantener.
  #
  # Este bloque declaraba un servicio `tms-web` que construía desde
  # `./frontend/tms-web/Dockerfile`. Ese fichero se retiró en 00f9386, cuando la publicación pasó
  # a Amplify, y el servicio quedó apuntando a una ruta inexistente: un blueprint que no puede
  # construir, esperando a que alguien lo desplegara para descubrirlo. Se retira aquí en lugar de
  # devolver el Dockerfile, porque dos canales de publicación para un mismo artefacto es una
  # invitación a que se desincronicen.
  #
  # Si algún día el frontend vuelve a Render, esto necesita un Dockerfile nuevo *y* retirar
  # Amplify - no las dos cosas a la vez.
  # ------------------------------------------------------------------------------------------
